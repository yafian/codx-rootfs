name: Sync Rootfs from Upstream

on:
  schedule:
    - cron: '0 0 1 * *'  # First day of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dist folder
        run: mkdir -p dist

      - name: Download Alpine
        run: bash scripts/download-alpine.sh
        continue-on-error: true

      - name: Download Arch Linux
        run: bash scripts/download-arch.sh
        continue-on-error: true

      - name: Download Debian
        run: bash scripts/download-debian.sh
        continue-on-error: true

      - name: Download Ubuntu
        run: bash scripts/download-ubuntu.sh
        continue-on-error: true

      - name: Download Rocky Linux
        run: bash scripts/download-rocky.sh
        continue-on-error: true

      - name: Download openSUSE
        run: bash scripts/download-opensuse.sh
        continue-on-error: true

      - name: Download Void Linux
        run: bash scripts/download-void.sh
        continue-on-error: true

      - name: Download Manjaro
        run: bash scripts/download-manjaro.sh
        continue-on-error: true

      - name: Generate versions.json
        run: |
          python3 << 'PYEOF'
          import json, hashlib, os, glob

          # Load metadata from download scripts
          metadata = {}
          meta_path = "dist/metadata.jsonl"
          if os.path.exists(meta_path):
              with open(meta_path) as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      entry = json.loads(line)
                      metadata[entry["id"]] = entry

          # Build versions.json from actual files
          versions = []
          for f in sorted(glob.glob("dist/*.tar.xz")):
              basename = os.path.basename(f)
              size = os.path.getsize(f)
              sha256 = hashlib.sha256(open(f, "rb").read()).hexdigest()

              # Find matching metadata by filename
              info = None
              for entry in metadata.values():
                  if entry.get("fileName") == basename:
                      info = entry
                      break

              # Fallback: extract id from filename
              if not info:
                  # Try common patterns
                  for prefix in ["opensuse-leap", "archlinux", "debian", "ubuntu",
                                  "alpine", "rocky", "void", "manjaro"]:
                      if basename.startswith(prefix):
                          info = {"id": prefix, "version": "", "codename": ""}
                          break

              distro_id = info["id"] if info else basename.split("-")[0]
              version = info.get("version", "") if info else ""
              codename = info.get("codename", "") if info else ""

              versions.append({
                  "id": distro_id,
                  "fileName": basename,
                  "version": version,
                  "codename": codename,
                  "sha256": sha256,
                  "size": size,
              })

          with open("dist/versions.json", "w") as f:
              json.dump(versions, f, indent=2)

          print("Generated versions.json:")
          with open("dist/versions.json") as f:
              print(f.read())
          PYEOF

      - name: Create release
        run: |
          ls -lh dist/
          if ls dist/*.tar.xz 1>/dev/null 2>&1; then
            LATEST=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
            if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
              NEXT=1
            else
              NUM=$(echo "$LATEST" | grep -oP '[0-9]+')
              NEXT=$((NUM + 1))
            fi
            VERSION="v${NEXT}"
            cd dist
            sha256sum *.tar.xz > SHA256SUMS
            cd ..
            gh release create "$VERSION" dist/*.tar.xz dist/SHA256SUMS dist/versions.json \
              --title "CodX rootfs $VERSION" \
              --generate-notes
          else
            echo "No rootfs files found"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases (keep last 2)
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName,isLatest,updatedAt --jq 'sort_by(.updatedAt) | reverse')
          COUNT=$(echo "$RELEASES" | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
          if [ "$COUNT" -gt 2 ]; then
            DELETE=$(echo "$RELEASES" | python3 -c "import sys,json; releases=json.load(sys.stdin); [print(r['tagName']) for r in releases[2:]]")
            for TAG in $DELETE; do
              echo "Deleting old release: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
